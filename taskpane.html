<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filter and Export</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --ink: #1c2b2d; --muted: #5d6c6f; --line: #d9e1e2; --bg: #f6f8f8; --panel: #ffffff;
    --accent: #0f6e5a; --accent-ink: #ffffff; --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; background: var(--bg); color: var(--ink);
         font: 13px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 12px; font-weight: 600; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
            padding: 12px; margin-bottom: 12px; }
  h2 { font-size: 13px; margin: 0 0 8px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  label { display: block; margin: 8px 0 3px; color: var(--muted); }
  select, input[type=text] { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px;
                             font: inherit; color: var(--ink); background: #fff; }
  select:focus, input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sheets { max-height: 130px; overflow-y: auto; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
  .sheets label, .opt { display: flex; gap: 8px; align-items: center; margin: 4px 0; color: var(--ink); cursor: pointer; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin-top: 2px; }
  .seg label { flex: 1; margin: 0; text-align: center; padding: 6px 0; cursor: pointer; color: var(--ink); }
  .seg input { position: absolute; opacity: 0; }
  .seg input:checked + span { font-weight: 600; }
  .seg label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  button { font: inherit; padding: 7px 10px; border-radius: 4px; border: 1px solid var(--line);
           background: #fff; color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button:disabled { opacity: .55; cursor: default; }
  button.link { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 400; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions button { flex: 1; }
  .hidden { display: none; }
  .status { min-height: 18px; color: var(--muted); }
  .status.error { color: var(--danger); }
</style>
</head>
<body>
  <h1>Filter and export</h1>

  <section>
    <h2>Sheets
      <span><button class="link" id="selectAll">Select all</button> &nbsp; <button class="link" id="refresh">Refresh</button></span>
    </h2>
    <div class="sheets" id="sheetList"></div>
  </section>

  <section>
    <h2>Filter</h2>
    <label for="fSheet">Sheet</label>
    <select id="fSheet"></select>
    <label for="fCol">Column</label>
    <select id="fCol"></select>
    <label for="fOp">Condition</label>
    <select id="fOp">
      <option value="contains">Contains</option>
      <option value="equals">Equals</option>
      <option value="starts">Starts with</option>
      <option value="gt">Greater than</option>
      <option value="lt">Less than</option>
      <option value="between">Between</option>
    </select>
    <div class="row">
      <div><label for="fVal">Value</label><input type="text" id="fVal"></div>
      <div id="val2Wrap" class="hidden"><label for="fVal2">And</label><input type="text" id="fVal2"></div>
    </div>
    <div class="actions">
      <button class="primary" id="applyFilter">Apply filter</button>
      <button id="clearFilter">Clear filters</button>
    </div>
  </section>

  <section>
    <h2>Export</h2>
    <label>Format</label>
    <div class="seg">
      <label><input type="radio" name="fmt" value="pdf" checked><span>PDF</span></label>
      <label><input type="radio" name="fmt" value="xlsx"><span>Excel</span></label>
    </div>
    <label>Rows</label>
    <div class="seg">
      <label><input type="radio" name="scope" value="visible" checked><span>Filtered rows</span></label>
      <label><input type="radio" name="scope" value="all"><span>All rows</span></label>
    </div>
    <label>Layout</label>
    <div class="seg">
      <label><input type="radio" name="layout" value="separate" checked><span>Separate</span></label>
      <label><input type="radio" name="layout" value="merged"><span>One combined table</span></label>
    </div>
    <div class="actions">
      <button class="primary" id="exportBtn">Export file</button>
      <button id="copyBtn">Copy to new sheets</button>
    </div>
  </section>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <script src="taskpane.js"></script>
</body>
</html>
